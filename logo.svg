<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#2563EB" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  
  <!-- 【魔法氛围】微小四芒星与结界能量弧线 (Domain Expansion Sparkles) -->
  <path d="M 19,2 Q 19,4 21,4 Q 19,4 19,6 Q 19,4 17,4 Q 19,4 19,2 Z" fill="#2563EB" stroke="none" />
  <path d="M 4,4 Q 4,5 5,5 Q 4,5 4,6 Q 4,5 3,5 Q 4,5 4,4 Z" fill="#2563EB" stroke="none" />
  <path d="M 21,18 Q 21,19 22,19 Q 21,19 21,20 Q 21,19 20,19 Q 21,19 21,18 Z" fill="#2563EB" stroke="none" />
  <!-- 极简能量场虚线 -->
  <path d="M 3,19 A 16,16 0 0,1 19,3" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.6" />

  <!-- 【主干：中指 Standing Finger (后景)】 -->
  <!-- 中指上半部：被食指遮挡前的指尖部分 -->
  <path d="M 7.5,7.5 L 8.2,4 C 8.2,2.5 10.2,2.5 10.5,4 L 10.2,6.5" />
  <!-- 中指下半部：从食指下方延伸出的部分 -->
  <path d="M 7.2,12 L 7.5,15" />
  <path d="M 10,10.5 L 10.5,15 Q 11,14.5 11.5,14" />

  <!-- 【交叉：食指 Crossing Finger (前景)】 -->
  <!-- 完美贴合原图角度：从左侧关节跨越中指，指尖指向右侧 -->
  <path d="M 6,11.5 C 6,8 10,6.5 13,7 C 14.5,7.5 14.5,9.5 13.5,10 C 11.5,10.5 8,10 6,11.5" />

  <!-- 【张力：拇指 Thumb】 -->
  <!-- 贴合原图向右侧方延伸，并带有一点骨感的弯曲 -->
  <path d="M 11.5,14 C 14,14 16,12.5 17,10.5 C 17.5,9 15.5,8 14.5,10 Q 13.5,11.5 13,12" />

  <!-- 【蜷缩：无名指与小拇指 Curled Fingers】 -->
  <!-- 隐入掌心，构成底部的体积感 -->
  <path d="M 6,11.5 C 4,12.5 4,15.5 6,16.5 C 7,17 9,16.5 10.5,15" />
  <!-- 蜷缩指缝内部细节折线 -->
  <path d="M 5.5,14.5 C 6,15.5 8,16 9.5,15" />

  <!-- 【自然隐出：手腕线条 Wrist】 -->
  <path d="M 6,16.5 Q 6.5,20 7,22" />
  <path d="M 11.5,14 Q 12,18 12.5,22" />

</svg>