# Placeholder — the real release version is stamped in at build time from
# electron/package.json (the single source of truth). Do NOT hand-edit this;
# a packaged handq_config.yaml carries the true version, this source file
# stays 0.0.0 so there is nothing to keep in sync by hand.
version: '0.0.0'
llm:
  API_KEY:
  # All model identifiers available for selection in the Agent and Helper
  # tabs below.  One entry per model; order determines fallback priority
  # within each role's checked subset.
  available_models:
  - anthropic::claude-5-opus
  - anthropic::claude-5-sonnet
  - anthropic::claude-4-8-opus
  - anthropic::claude-4-7-opus
  - anthropic::claude-4-6-sonnet:1M
  - anthropic::claude-4-6-sonnet
  - anthropic::claude-4-5-sonnet
  - anthropic::claude-4-5-haiku:thinking
  - anthropic::claude-4-5-haiku
  # Agent pool — checked subset of available_models used by the coordinator
  # and the agent.  Order = fallback priority.
  agent_models:
  - anthropic::claude-5-sonnet
  - anthropic::claude-4-6-sonnet:1M
  - anthropic::claude-4-6-sonnet
  - anthropic::claude-4-5-sonnet
  - anthropic::claude-4-5-haiku:thinking
  - anthropic::claude-4-5-haiku
  # Helper pool — checked subset used by the scheduler's natural-language
  # schedule inference, the long-term-memory triage / reranker workers, and
  # other simple background classification tasks.
  helper_models:
  - anthropic::claude-4-5-haiku
  - anthropic::claude-4-5-haiku:thinking
session:
  log_level: INFO
  workspace_base: .workspace   # session artifacts subdir. On Windows: relative to
                               # the session storage dir. On Linux: relative to the
                               # machine-local install root (<root>/workspace/), NOT
                               # $HOME — see handq_setup.sh on the install root.
interaction_switches:
  tool_write:
    auto_approve: true
    description: Control write tool auto-execution
  tool_edit:
    auto_approve: true
    description: Control edit tool auto-execution
  tool_bash:
    auto_approve: true
    description: Control bash tool auto-execution
  tool_browser:
    auto_approve: true
    description: Browser automation (independent profile, off-screen window).
      Auto-approve controls whether each browser action runs without asking.
      attach_browser is gated separately by the high_risk switch and always
      asks regardless of these settings.
  tool_desktop:
    auto_approve: false
    description: Desktop automation (mouse / keyboard / screen capture).
      Auto-approve is OFF by default because input actions affect any focused
      application, not just the agent's own browser. Sensitive windows
      (password managers, banking) are always refused regardless of these switches.
  high_risk:
    auto_approve: true
    description: Control high-risk operation auto-execution
browser:
  attach_enabled: true
  cdp_port: 9222
  cdp_url: ''
  prefer_attach: false
teams:
  # Token cache directory. Blank → %USERPROFILE%\HandQ\teams_cache\.
  # The cache stores ACCESS tokens harvested from your already-signed-in
  # Teams Web session (NOT refresh tokens — Microsoft caps SPA refresh
  # tokens at 24 h and refuses to extend them via the OAuth endpoint).
  # Tokens are short-lived (~1 h); the tool re-bootstraps via Playwright
  # against teams.microsoft.com when the cache expires. Treat the file
  # like a credential.
  # client_id / tenant_id are NOT configurable: the tool rides on
  # Microsoft Teams Web's own MSAL session (client 5e3ce6c0-...,
  # which every tenant that allows Teams must, by definition, allow).
  cache_dir: ''
high_risk_commands:
  always_dangerous_keywords:
  - shutdown
  - reboot
  - halt
  - poweroff
  - kill
  - pkill
  - killall
  - mkfs
  - fdisk
  - parted
  - dd
  - systemctl
  always_dangerous_patterns:
  - dd\s+.*of=/dev/
  - DROP\s+DATABASE
  - DROP\s+TABLE
  - git\s+push.*--force
  - git\s+push.*-f\b
  - '>\s*/dev/sd[a-z]'
  high_risk_keywords:
  - rm
  - delete
  - del
  - remove
  - unlink
  - truncate
  - chmod
  - chown
  - uninstall
  - pip uninstall
  - apt remove
  - yum remove
  - git reset --hard
  - git clean -fd
  - curl -X DELETE
  - wget --delete
  custom_patterns:
  - rm\s+-rf\s+/
  whitelist:
  - rm -rf ./temp
  - rm *.tmp
  - rm -rf __pycache__
vision:
  model: azure::gpt-5.4-mini
  timeout: 120
  verify_ssl: false
  max_image_dim: 1024
  ocr:
    engine: rapidocr
    lang: ch
screenshots:
  ephemeral:
    max_files: 30
    max_age_minutes: 15
  task:
    retain_after_task_days: 1
    max_files: 50
desktop:
  sensitive_window_patterns:
  - (?i)bitwarden|1password|keepass|lastpass|dashlane
  - (?i)bank|wallet|crypto|trading
web_search:
  default_limit: 10
  max_limit: 25
  snippet_max_chars: 300
  sources:
    confluence:
      enabled: true
      base_url: https://qualcomm-confluence.atlassian.net
      api_path: /wiki/rest/api/search
    jira:
      enabled: true
      base_url: https://jira-dc.qualcomm.com
      api_path: /jira/rest/api/2/search
    sharepoint:
      enabled: true
      base_url: https://qualcomm.sharepoint.com
      api_path: /_api/search/query
    orbit:
      enabled: true
      base_url: https://orbit
      search_url_template: 'https://orbit/search?query={q}&pagesize=10'
      result_selector: 'a.request-link'
      timeout_ms: 30000   # page.goto deadline; the real intranet page can take >10s to load
    qgenie:
      # The qgenie-chat assistant (SSO web app) — returns ONE synthesised,
      # cited answer, not a ranked hit list. Auth is two tokens (Bearer +
      # x-copilot-token), harvested passively from the app's own token traffic;
      # NOT cookies. Runs in-page (needs a launched browser session, like orbit).
      enabled: true
      base_url: https://qgenie-chat.qualcomm.com
      chat_page: https://qgenie-chat.qualcomm.com/apps/chat
      token_url: https://qgenie-chat.qualcomm.com/api/apigee/token
      chat_url: https://apigw-op.qualcomm.com/qgeniechat/ui/v1/chat
      model_name: anthropic::claude-4-6-sonnet
      internal_qualcomm_search: true   # let qgenie RAG-search internal knowledge before answering
      timeout_ms: 120000   # RAG + synthesis is slow — 30-60s+ is normal
email:
  body_preview_chars: 500
  attachment_sandbox: '%USERPROFILE%\HandQ\email_attachments'
  folder_blacklist: []
  max_recursion_depth: 4   # Inbox sub-folder walk depth for list_messages / search
personalization:
  # When ON, HandQ tailors its plans to the tools and project conventions
  # it sees you working with. When OFF, every task starts from a blank
  # slate — HandQ won't carry context across sessions.
  enabled: true
  excluded_apps: []
  git_hook_repos: []
update:
  share_path: '\\wine\APTAuto\ADAS\fengxuan\HandQ\Windows'
  # Where built handq-linux-<version>.tar.gz packages are dropped (see
  # packaging/build_linux.sh). When set, remote_handq auto-deploys/upgrades
  # handq_linux on a remote host before delegating a goal to it. Blank
  # disables the feature — the remote must be pre-installed as before.
  linux_share_path: '\\wine\APTAuto\ADAS\fengxuan\HandQ\Linux'
