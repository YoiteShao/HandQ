version: '4.0'
llm:
  API_KEY: ''
  models:
  - anthropic::claude-4-7-opus
  - anthropic::claude-4-6-opus:1M
  - anthropic::claude-4-6-opus
  - anthropic::claude-4-6-sonnet:1M
  - anthropic::claude-4-6-sonnet
  - anthropic::claude-4-5-sonnet
  - anthropic::claude-4-5-haiku:thinking
  - anthropic::claude-4-5-haiku
  - anthropic::claude-4-sonnet
  - anthropic::claude-3-7-sonnet
  - anthropic::claude-3-5-sonnet
  roles:
    planner:
    - anthropic::claude-4-6-sonnet
    - anthropic::claude-4-5-sonnet
    - anthropic::claude-4-5-haiku:thinking
    - anthropic::claude-4-5-haiku
    receptionist:
    - anthropic::claude-4-5-sonnet
    - anthropic::claude-4-5-haiku:thinking
    - anthropic::claude-4-5-haiku
    agent:
    - anthropic::claude-4-6-sonnet
    - anthropic::claude-4-5-sonnet
    - anthropic::claude-4-5-haiku:thinking
    - anthropic::claude-4-5-haiku
    - anthropic::claude-4-sonnet
    - anthropic::claude-3-7-sonnet
    - anthropic::claude-3-5-sonnet
    helper:
    - anthropic::claude-4-5-sonnet
    - anthropic::claude-4-5-haiku:thinking
    - anthropic::claude-4-5-haiku
session:
  log_level: INFO
  step_verification_threshold: 0.8
interaction_switches:
  tool_write:
    auto_approve: true
    description: Control write tool auto-execution
  tool_edit:
    auto_approve: true
    description: Control edit tool auto-execution
  tool_bash:
    auto_approve: true
    description: Control bash tool auto-execution
  tool_browser:
    auto_approve: true
    description: Browser automation (independent profile, off-screen window). When
      unchecked, every browser action prompts for approval. attach_browser is gated
      separately by the high_risk switch and always asks regardless of this setting.
  tool_desktop:
    auto_approve: false
    description: Desktop automation (mouse / keyboard / screen capture). OFF by default
      because input actions affect any focused application, not just the agent's own
      browser. Sensitive windows (password managers, banking) are always refused regardless
      of this switch.
  tool_web_search:
    auto_approve: true
    description: Internal web search (Confluence / Jira / SharePoint / orbit) via
      the authenticated browser session. Read-only — returns title/url/snippet
      lists. Cookies and SSO are reused from the persistent browser profile.
  tool_email:
    auto_approve: true
    description: Email read via local Outlook COM (win32com). Read actions are
      low-risk. Write actions (compose_draft / send) — when added — will go
      through the high_risk gate plus a recipient_domain_allowlist check.
  high_risk:
    auto_approve: true
    description: Control high-risk operation auto-execution
browser:
  attach_enabled: false
  cdp_port: 9222
  cdp_url: ''
  prefer_attach: false
high_risk_commands:
  always_dangerous_keywords:
  - shutdown
  - reboot
  - halt
  - poweroff
  - kill
  - pkill
  - killall
  - mkfs
  - fdisk
  - parted
  - dd
  - systemctl
  always_dangerous_patterns:
  - dd\s+.*of=/dev/
  - DROP\s+DATABASE
  - DROP\s+TABLE
  - git\s+push.*--force
  - git\s+push.*-f\b
  - '>\s*/dev/sd[a-z]'
  high_risk_keywords:
  - rm
  - delete
  - del
  - remove
  - unlink
  - truncate
  - chmod
  - chown
  - uninstall
  - pip uninstall
  - apt remove
  - yum remove
  - git reset --hard
  - git clean -fd
  - curl -X DELETE
  - wget --delete
  custom_patterns:
  - rm\s+-rf\s+/
  whitelist:
  - rm -rf ./temp
  - rm *.tmp
  - rm -rf __pycache__
vision:
  model: azure::gpt-5.4-mini
  timeout: 120
  verify_ssl: false
  max_image_dim: 1024
  ocr:
    engine: rapidocr
    lang: ch
screenshots:
  ephemeral:
    max_files: 30
    max_age_minutes: 15
  task:
    retain_after_task_days: 1
    max_files: 50
  activity:
    max_files: 100
    max_age_days: 1
desktop:
  sensitive_window_patterns:
  - (?i)bitwarden|1password|keepass|lastpass|dashlane
  - (?i)bank|wallet|crypto|trading
web_search:
  default_limit: 10
  max_limit: 25
  snippet_max_chars: 300
  sources:
    confluence:
      enabled: true
      base_url: https://qualcomm-confluence.atlassian.net
      api_path: /wiki/rest/api/search
    jira:
      enabled: true
      base_url: https://jira-dc.qualcomm.com
      api_path: /jira/rest/api/2/search
    sharepoint:
      enabled: true
      base_url: https://qualcomm.sharepoint.com
      api_path: /_api/search/query
    orbit:
      enabled: true
      base_url: https://orbit
      search_url_template: 'https://orbit/search?query={q}&pagesize=10'
      result_selector: 'a[href*="/CR/"]'
email:
  body_preview_chars: 500
  attachment_sandbox: '%USERPROFILE%\HandQ\email_attachments'
  folder_blacklist: []
