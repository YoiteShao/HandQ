version: '4.0'
llm:
  API_KEY: 
  models:
  - anthropic::claude-4-7-opus
  - anthropic::claude-4-6-opus:1M
  - anthropic::claude-4-6-opus
  - anthropic::claude-4-6-sonnet:1M
  - anthropic::claude-4-6-sonnet
  - anthropic::claude-4-5-sonnet
  - anthropic::claude-4-5-haiku:thinking
  - anthropic::claude-4-5-haiku
  roles:
    planner:
    - anthropic::claude-4-6-sonnet:1M
    - anthropic::claude-4-6-sonnet
    - anthropic::claude-4-5-sonnet
    - anthropic::claude-4-5-haiku:thinking
    - anthropic::claude-4-5-haiku
    receptionist:
    - anthropic::claude-4-5-sonnet
    - anthropic::claude-4-5-haiku:thinking
    - anthropic::claude-4-5-haiku
    agent:
    - anthropic::claude-4-6-sonnet:1M
    - anthropic::claude-4-6-sonnet
    - anthropic::claude-4-5-sonnet
    - anthropic::claude-4-5-haiku:thinking
    - anthropic::claude-4-5-haiku
    helper:
    - anthropic::claude-4-5-sonnet
    - anthropic::claude-4-5-haiku:thinking
    - anthropic::claude-4-5-haiku
session:
  log_level: INFO
  step_verification_threshold: 0.8
  workspace_base: .workspace   # session artifacts written here (relative to cwd)
interaction_switches:
  tool_write:
    auto_approve: true
    description: Control write tool auto-execution
  tool_edit:
    auto_approve: true
    description: Control edit tool auto-execution
  tool_bash:
    auto_approve: true
    description: Control bash tool auto-execution
  tool_browser:
    auto_approve: false
    description: Browser automation (independent profile, off-screen window).
      Auto-approve controls whether each browser action runs without asking.
      attach_browser is gated separately by the high_risk switch and always
      asks regardless of these settings.
  tool_desktop:
    auto_approve: false
    description: Desktop automation (mouse / keyboard / screen capture).
      Auto-approve is OFF by default because input actions affect any focused
      application, not just the agent's own browser. Sensitive windows
      (password managers, banking) are always refused regardless of these switches.
  tool_web_search:
    auto_approve: true
    description: Internal web search (Confluence / Jira / SharePoint / orbit) via
      the authenticated browser session. Auto-approve controls per-call prompts.
      Read-only — returns title/url/snippet lists. Cookies and SSO are reused
      from the persistent browser profile.
  tool_email:
    auto_approve: true
    description: Email read via local Outlook COM (win32com). Auto-approve controls
      per-call prompts. Read actions are low-risk. Write actions (compose_draft /
      send) — when added — will go through the high_risk gate plus a
      recipient_domain_allowlist check.
  high_risk:
    auto_approve: true
    description: Control high-risk operation auto-execution
browser:
  attach_enabled: false
  cdp_port: 9222
  cdp_url: ''
  prefer_attach: false
high_risk_commands:
  always_dangerous_keywords:
  - shutdown
  - reboot
  - halt
  - poweroff
  - kill
  - pkill
  - killall
  - mkfs
  - fdisk
  - parted
  - dd
  - systemctl
  always_dangerous_patterns:
  - dd\s+.*of=/dev/
  - DROP\s+DATABASE
  - DROP\s+TABLE
  - git\s+push.*--force
  - git\s+push.*-f\b
  - '>\s*/dev/sd[a-z]'
  high_risk_keywords:
  - rm
  - delete
  - del
  - remove
  - unlink
  - truncate
  - chmod
  - chown
  - uninstall
  - pip uninstall
  - apt remove
  - yum remove
  - git reset --hard
  - git clean -fd
  - curl -X DELETE
  - wget --delete
  custom_patterns:
  - rm\s+-rf\s+/
  whitelist:
  - rm -rf ./temp
  - rm *.tmp
  - rm -rf __pycache__
vision:
  model: azure::gpt-5.4-mini
  timeout: 120
  verify_ssl: false
  max_image_dim: 1024
  ocr:
    engine: rapidocr
    lang: ch
screenshots:
  ephemeral:
    max_files: 30
    max_age_minutes: 15
  task:
    retain_after_task_days: 1
    max_files: 50
desktop:
  sensitive_window_patterns:
  - (?i)bitwarden|1password|keepass|lastpass|dashlane
  - (?i)bank|wallet|crypto|trading
web_search:
  default_limit: 10
  max_limit: 25
  snippet_max_chars: 300
  sources:
    confluence:
      enabled: true
      base_url: https://qualcomm-confluence.atlassian.net
      api_path: /wiki/rest/api/search
    jira:
      enabled: true
      base_url: https://jira-dc.qualcomm.com
      api_path: /jira/rest/api/2/search
    sharepoint:
      enabled: true
      base_url: https://qualcomm.sharepoint.com
      api_path: /_api/search/query
    orbit:
      enabled: true
      base_url: https://orbit
      search_url_template: 'https://orbit/search?query={q}&pagesize=10'
      result_selector: 'a[href*="/CR/"]'
      timeout_ms: 10000   # page.goto deadline; raise if intranet DNS is slow
email:
  body_preview_chars: 500
  attachment_sandbox: '%USERPROFILE%\HandQ\email_attachments'
  folder_blacklist: []
  max_recursion_depth: 4   # Inbox sub-folder walk depth for list_messages / search
personalization:
  # When ON, HandQ tailors its plans to the tools and project conventions
  # it sees you working with. When OFF, every task starts from a blank
  # slate — HandQ won't carry context across sessions.
  enabled: true
  excluded_apps: []
  git_hook_repos: []
update:
  share_path: '\\wine\APTAuto\ADAS\fengxuan\HandQ\Windows'
