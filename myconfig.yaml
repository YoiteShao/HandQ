version: "3.0"

# ── LLM Settings ──────────────────────────────────────────────────────────────
llm:
  API_KEY: "ff6bb18f-4a84-401d-9989-f6997487abe5"
  # max_tokens: 128000 # 64000

  models: # Call orders
    - "anthropic::claude-4-7-opus"
    - "anthropic::claude-4-6-opus:1M"
    - "anthropic::claude-4-6-opus"
    - "anthropic::claude-4-6-sonnet:1M"
    - "anthropic::claude-4-6-sonnet"      
    - "anthropic::claude-4-5-sonnet"      
    - "anthropic::claude-4-5-haiku:thinking"
    - "anthropic::claude-4-5-haiku"
    - "anthropic::claude-4-sonnet"
    - "anthropic::claude-3-7-sonnet"
    - "anthropic::claude-3-5-sonnet"

# ── Session Settings ──────────────────────────────────────────────────────────
session:
  workspace_base: .fengxuanworkspace   # Base directory for session workspaces
  log_level: "INFO"             # DEBUG | INFO | WARNING | ERROR
  step_verification_threshold: 0.8
  venv_path: /local/mnt/workspace/venvs/genai_nb/   # Path to Suggest Python virtual environment (null = use system Python)

# ── Interaction Switches ──────────────────────────────────────────────────────
interaction_switches:
  tool_write:
    auto_approve: true
    description: "Control write tool auto-execution"

  tool_edit:
    auto_approve: true
    description: "Control edit tool auto-execution"

  tool_bash:
    auto_approve: true
    description: "Control bash tool auto-execution"

  high_risk:
    auto_approve: true
    description: "Control high-risk operation auto-execution"

# ── High Risk Commands ────────────────────────────────────────────────────────
high_risk_commands:

  # ============================================================
  # Always-dangerous operations (require user confirmation
  # regardless of path; these are system-level ops that cannot
  # be mitigated by path checking)
  # ============================================================

  always_dangerous_keywords:
    # System shutdown / reboot
    - shutdown
    - reboot
    - halt
    - poweroff

    # Force-kill processes
    - kill
    - pkill
    - killall

    # Disk / filesystem operations (direct device access)
    - mkfs
    - fdisk
    - parted
    - dd

    # System service management
    - systemctl

  # Always-dangerous regex patterns (regardless of path)
  always_dangerous_patterns:
    - "dd\\s+.*of=/dev/"        # Write directly to a disk device
    - "DROP\\s+DATABASE"         # Drop a database
    - "DROP\\s+TABLE"            # Drop a table
    - "git\\s+push.*--force"     # Force-push to remote
    - "git\\s+push.*-f\\b"       # Force-push shorthand
    - ">\\s*/dev/sd[a-z]"        # Redirect output to a disk device

  # ============================================================
  # Path-based risky operations (auto-approved when ALL
  # referenced paths resolve inside the working directory)
  # ============================================================

  high_risk_keywords:
    # File deletion
    - rm
    - delete
    - del
    - remove
    - unlink

    # File truncation
    - truncate

    # Permission / ownership changes
    - chmod
    - chown

    # Package uninstall
    - uninstall
    - pip uninstall
    - apt remove
    - yum remove

    # Destructive VCS operations (local)
    - git reset --hard
    - git clean -fd

    # Network delete operations
    - curl -X DELETE
    - wget --delete

  # Custom regex patterns (auto-approved when paths are inside working dir)
  custom_patterns:
    - "rm\\s+-rf\\s+/"  # Delete from root (absolute path)

  # Whitelist — always safe even if a keyword matches
  whitelist:
    - "rm -rf ./temp"       # Delete temp directory
    - "rm *.tmp"            # Delete temp files
    - "rm -rf __pycache__"  # Delete Python cache
