version: '3.0'
llm:
  API_KEY: ff6bb18f-4a84-401d-9989-f6997487abe5
  models:
  - anthropic::claude-4-7-opus
  - anthropic::claude-4-6-opus:1M
  - anthropic::claude-4-6-opus
  - anthropic::claude-4-6-sonnet:1M
  - anthropic::claude-4-6-sonnet
  - anthropic::claude-4-5-sonnet
  - anthropic::claude-4-5-haiku:thinking
  - anthropic::claude-4-5-haiku
  - anthropic::claude-4-sonnet
  - anthropic::claude-3-7-sonnet
  - anthropic::claude-3-5-sonnet
  roles:
    planner:
    - anthropic::claude-4-6-sonnet
    - anthropic::claude-4-5-sonnet
    - anthropic::claude-4-5-haiku:thinking
    - anthropic::claude-4-5-haiku
    receptionist:
    - anthropic::claude-4-5-sonnet
    - anthropic::claude-4-5-haiku:thinking
    - anthropic::claude-4-5-haiku
    agent:
    - anthropic::claude-4-6-sonnet
    - anthropic::claude-4-5-sonnet
    - anthropic::claude-4-5-haiku:thinking
    - anthropic::claude-4-5-haiku
    - anthropic::claude-4-sonnet
    - anthropic::claude-3-7-sonnet
    - anthropic::claude-3-5-sonnet
    helper:
    - anthropic::claude-4-5-sonnet
    - anthropic::claude-4-5-haiku:thinking
    - anthropic::claude-4-5-haiku
session:
  log_level: INFO
  step_verification_threshold: 0.8
interaction_switches:
  tool_write:
    auto_approve: true
    description: Control write tool auto-execution
  tool_edit:
    auto_approve: true
    description: Control edit tool auto-execution
  tool_bash:
    auto_approve: true
    description: Control bash tool auto-execution
  tool_browser:
    auto_approve: true
    description: Browser automation (independent profile, off-screen window). When
      unchecked, every browser action prompts for approval. attach_browser is gated
      separately by the high_risk switch and always asks regardless of this setting.
  high_risk:
    auto_approve: false
    description: Control high-risk operation auto-execution
browser:
  attach_enabled: false
  cdp_port: 9222
  cdp_url: ''
  prefer_attach: false
high_risk_commands:
  always_dangerous_keywords:
  - shutdown
  - reboot
  - halt
  - poweroff
  - kill
  - pkill
  - killall
  - mkfs
  - fdisk
  - parted
  - dd
  - systemctl
  always_dangerous_patterns:
  - dd\s+.*of=/dev/
  - DROP\s+DATABASE
  - DROP\s+TABLE
  - git\s+push.*--force
  - git\s+push.*-f\b
  - '>\s*/dev/sd[a-z]'
  high_risk_keywords:
  - rm
  - delete
  - del
  - remove
  - unlink
  - truncate
  - chmod
  - chown
  - uninstall
  - pip uninstall
  - apt remove
  - yum remove
  - git reset --hard
  - git clean -fd
  - curl -X DELETE
  - wget --delete
  custom_patterns:
  - rm\s+-rf\s+/
  whitelist:
  - rm -rf ./temp
  - rm *.tmp
  - rm -rf __pycache__
vision:
  # OpenAI-Chat-Completions-compatible endpoint. QGenie gateway routes by
  # the model-name prefix (azure::/openai::/anthropic::). See plan §1.1.
  endpoint: https://qgenie-api.qualcomm.com/v1
  api_key: ff6bb18f-4a84-401d-9989-f6997487abe5
  model: azure::gpt-5.4-mini
  # Per-call HTTP timeout (seconds). The model itself takes 3-7s on
  # warm path, so 120 leaves plenty of headroom for cold-start / retries.
  timeout: 120
  # QGenie uses Qualcomm's internal CA which is not in the public
  # truststore — same trick as scripts/vision_bench/test_vision_gpt.py.
  verify_ssl: false
  # Long-edge resize cap before sending. Below 768 most UI detail is
  # lost; above 1568 hits the gateway's auto-scaling path with no
  # accuracy gain. 1024 is the sweet spot for the canvas / find_element
  # use cases.
  max_image_dim: 1024
screenshots:
  # Tiered SCRATCH storage for vision artifacts. Long-term keepers do
  # NOT live here — agents save those into the task's session
  # working_directory under %USERPROFILE%\HandQ\History\<id>\ instead.
  # Limits below are intentionally conservative — bump only if you see
  # the agent losing useful context to retention.
  ephemeral:
    # vision_query / find_element work files. Producer-internal; LLM
    # has no API to write here.
    max_files: 30
    max_age_minutes: 15
  task:
    # Explicit screenshot calls during a task. Aged sweep at session
    # close based on retain_after_task_days.
    retain_after_task_days: 1
    max_files: 50
  activity:
    # Phase 3 activity_monitor periodic frames. Conservative defaults;
    # raise after Phase 3 lands and real numbers are in.
    max_files: 100
    max_age_days: 1
